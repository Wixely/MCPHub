name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MCPHub.slnx

      - name: Build
        run: dotnet build MCPHub.slnx -c Release --no-restore

      - name: Test
        run: dotnet test MCPHub.slnx -c Release --no-build --verbosity normal

      # Packability gate: a change that breaks dotnet pack fails the PR, not the release.
      - name: Pack libraries
        run: pwsh eng/PackLibraries.ps1 -CI

      # Consumer gate: the sample restores the freshly packed packages from the local feed
      # (never project references), proving external consumption works end to end.
      - name: Build and run consumer sample
        run: |
          dotnet restore samples/EmbeddedHub/EmbeddedHub.csproj
          dotnet run --project samples/EmbeddedHub/EmbeddedHub.csproj --no-restore
