name: Release

# Builds standalone, single-file, self-contained MCPHub apps for Windows and Linux.
# - On a version tag (v*) it publishes both and attaches them to a GitHub Release.
# - It can also be run manually (workflow_dispatch) to produce the binaries as artifacts.
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [ win-x64, linux-x64 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Publish single-file self-contained (${{ matrix.rid }})
        run: >
          dotnet publish src/MCPHub.App/MCPHub.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -p:DebugSymbols=false
          -o publish/${{ matrix.rid }}

      - name: Package
        run: |
          cd publish/${{ matrix.rid }}
          zip -r "../../MCPHub-${{ matrix.rid }}-${{ github.ref_name }}.zip" .

      - uses: actions/upload-artifact@v4
        with:
          name: MCPHub-${{ matrix.rid }}
          path: MCPHub-${{ matrix.rid }}-${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 1

  release:
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # The body is the tag's own annotation. Release notes here are written by hand before the
      # tag is pushed; generated notes list commit subjects instead, which say how the work
      # arrived rather than what shipped — and they silently REPLACE the annotation, which is how
      # v0.14.0 shipped with a one-line changelog and nothing else.
      #
      # Read over the API, never from a checkout: actions/checkout resolves the ref to a commit
      # and force-updates refs/tags/<tag> to point at it, so the annotation is unreachable
      # locally whatever fetch-depth says. This job checks out nothing for that reason.
      - name: Create the release from the tag's own annotation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; leaving its notes alone."
            exit 0
          fi

          ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}")"
          obj_type="$(jq -r '.object.type' <<<"${ref_json}")"
          obj_sha="$(jq -r '.object.sha' <<<"${ref_json}")"

          if [ "${obj_type}" = "tag" ]; then
            notes="${RUNNER_TEMP}/release-notes.md"
            gh api "repos/${GITHUB_REPOSITORY}/git/tags/${obj_sha}" --jq '.message' > "${notes}"
            echo "Annotated tag: release body from its message ($(wc -c < "${notes}") bytes)."
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --notes-file "${notes}"
          else
            echo "${GITHUB_REF_NAME} is a lightweight tag (object type '${obj_type}'); generating notes."
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
          fi

      - name: Upload the release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" dist/*.zip --repo "${GITHUB_REPOSITORY}" --clobber

  # Publishes the three embeddable libraries (Proxy, Hosting, Processes) to the Wixely
  # GitHub Packages NuGet feed. Consumers restore with a read:packages PAT against
  # https://nuget.pkg.github.com/Wixely/index.json.
  publish-packages:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET (pinned by global.json)
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Pack libraries
        run: pwsh eng/PackLibraries.ps1 -CI

      - name: Push to Wixely GitHub Packages feed
        run: >
          dotnet nuget push 'artifacts/packages/*.nupkg'
          --source 'https://nuget.pkg.github.com/Wixely/index.json'
          --api-key '${{ secrets.GITHUB_TOKEN }}'
          --skip-duplicate
